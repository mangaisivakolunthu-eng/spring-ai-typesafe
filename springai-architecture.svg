<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="Spring AI TypeSafe architecture: one client, three interchangeable SystemOne engines">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7b8794"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6db33f"/></marker>
    <marker id="at" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#01a88d"/></marker>
    <style>
      .t{fill:#fff;font-weight:600}
      .st{fill:#eef;font-size:10.5px}
      .lbl{fill:#5a6b7b;font-size:11.5px}
      .hd{font-size:12.5px;font-weight:800;letter-spacing:1px}
      .mono{font-family:Consolas,monospace}
    </style>
  </defs>

  <rect width="1200" height="640" rx="14" fill="#f4faf0"/>
  <text x="34" y="44" font-size="23" font-weight="800" fill="#2c5218">Spring AI TypeSafe — one client, three engines</text>
  <text x="34" y="68" class="lbl">Ask a bounded question → get a typed answer. Swap engines with config, not code.</text>

  <!-- Spring app -->
  <text x="40" y="120" class="hd" fill="#6db33f">YOUR SPRING APP</text>
  <rect x="40" y="134" width="220" height="200" rx="12" fill="#eef7e6" stroke="#6db33f" stroke-width="2"/>
  <circle cx="76" cy="172" r="16" fill="#6db33f"/><text x="76" y="177" text-anchor="middle" class="t">🌱</text>
  <text x="102" y="170" font-size="13" font-weight="700" fill="#2c5218">Spring Boot</text>
  <text x="102" y="188" class="lbl" font-size="11">judges · guardrails</text>
  <text x="102" y="204" class="lbl" font-size="11">RAG screening · tools</text>

  <rect x="58" y="222" width="184" height="96" rx="8" fill="#0f1b2d"/>
  <text x="72" y="244" class="mono" font-size="10" fill="#9ad07a">typeSafe.yesNo(...)</text>
  <text x="72" y="262" class="mono" font-size="10" fill="#9ad07a">typeSafe.choice(...)</text>
  <text x="72" y="280" class="mono" font-size="10" fill="#9ad07a">typeSafe.score(...)</text>
  <text x="72" y="302" class="mono" font-size="9.5" fill="#7fd8c6">JsonContent.object(...)</text>

  <!-- TypeSafe client -->
  <text x="320" y="120" class="hd" fill="#01a88d">TYPESAFE CLIENT</text>
  <rect x="320" y="134" width="210" height="200" rx="12" fill="#e6f7f2" stroke="#01a88d" stroke-width="2"/>
  <text x="340" y="166" font-size="13" font-weight="700" fill="#12776a">Spring AI TypeSafe</text>
  <text x="340" y="186" class="lbl" font-size="11">• builds ordered request</text>
  <text x="340" y="204" class="lbl" font-size="11">• fixed field order (fix)</text>
  <text x="340" y="222" class="lbl" font-size="11">• returns a Java type</text>
  <rect x="338" y="238" width="174" height="74" rx="8" fill="#fff" stroke="#a8e0d4"/>
  <text x="352" y="260" class="lbl" font-size="10.5">config:</text>
  <text x="352" y="278" class="mono" font-size="9.5" fill="#12776a">base-url=…:8002</text>
  <text x="352" y="294" class="mono" font-size="9.5" fill="#12776a">api-key=local-test</text>

  <!-- protocol -->
  <rect x="576" y="200" width="120" height="70" rx="10" fill="#334" />
  <text x="636" y="228" text-anchor="middle" class="t mono" font-size="12">/v1/</text>
  <text x="636" y="248" text-anchor="middle" class="t mono" font-size="12">systemone</text>
  <text x="636" y="286" text-anchor="middle" class="lbl" font-size="10">one protocol</text>

  <!-- engines -->
  <text x="756" y="120" class="hd" fill="#7b8794">INTERCHANGEABLE ENGINES</text>

  <rect x="756" y="132" width="410" height="72" rx="12" fill="#eafaf4" stroke="#01a88d" stroke-width="1.5"/>
  <text x="776" y="160" font-size="13" font-weight="700" fill="#12776a">Hosted engine — Jev</text>
  <text x="776" y="180" class="lbl" font-size="11">production · most decisive judgments</text>
  <text x="776" y="196" class="lbl" font-size="10.5">base-url → hosted API + key</text>

  <rect x="756" y="216" width="410" height="82" rx="12" fill="#eef7e6" stroke="#6db33f" stroke-width="2"/>
  <text x="776" y="244" font-size="13" font-weight="700" fill="#2c5218">laya-serve — local (Apache-2.0)  🆕</text>
  <text x="776" y="264" class="lbl" font-size="11">offline dev · no hosted key · ~30 ms/call on laptop GPU</text>
  <text x="776" y="282" class="lbl" font-size="10.5" font-style="italic">stand-in: less decisive on subtle checks — re-measure thresholds</text>

  <rect x="756" y="310" width="410" height="66" rx="12" fill="#f3ecfc" stroke="#8a52c9" stroke-width="1.5"/>
  <text x="776" y="338" font-size="13" font-weight="700" fill="#6b39b0">Ollama SystemOne  🆕</text>
  <text x="776" y="358" class="lbl" font-size="11">local, via the new Ollama SystemOne endpoint</text>

  <!-- typed answer -->
  <text x="320" y="420" class="hd" fill="#01a88d">TYPED ANSWER (not text)</text>
  <rect x="320" y="434" width="846" height="70" rx="12" fill="#fff" stroke="#01a88d" stroke-width="2"/>
  <rect x="340" y="450" width="150" height="38" rx="8" fill="#01a88d"/><text x="415" y="474" text-anchor="middle" class="t">yes / no  →  boolean</text>
  <rect x="506" y="450" width="150" height="38" rx="8" fill="#12b39a"/><text x="581" y="474" text-anchor="middle" class="t">choice  →  enum</text>
  <rect x="672" y="450" width="150" height="38" rx="8" fill="#1ec9ad"/><text x="747" y="474" text-anchor="middle" class="t">score  →  number</text>
  <text x="850" y="474" class="lbl" font-size="11.5">→ your code acts on it directly (no parsing)</text>

  <!-- arrows -->
  <line x1="260" y1="234" x2="318" y2="234" stroke="#6db33f" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="530" y1="234" x2="574" y2="234" stroke="#01a88d" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="696" y1="200" x2="754" y2="168" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
  <line x1="696" y1="240" x2="754" y2="255" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
  <line x1="696" y1="268" x2="754" y2="338" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
  <line x1="425" y1="334" x2="425" y2="432" stroke="#01a88d" stroke-width="2" marker-end="url(#at)"/>

  <text x="34" y="560" class="lbl" font-size="12" font-style="italic">Same code, same /v1/systemone protocol — hosted Jev in prod, Laya or Ollama locally. TypeSafe returns a Java type your code already trusts.</text>
  <text x="34" y="600" class="lbl" font-size="11">Spring · Java · structured AI judgment — by eswaran-hariharan</text>
</svg>
